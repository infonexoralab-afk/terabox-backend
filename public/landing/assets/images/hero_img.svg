<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" width="600" height="550" fill="none">
  <defs>
    <linearGradient id="heroCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005CE6"/>
      <stop offset="100%" stop-color="#4791FF"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="shadowMain" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#005CE6" flood-opacity="0.16"/>
    </filter>
    <filter id="floatCardShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow Circles -->
  <circle cx="300" cy="260" r="180" fill="#E0F2FE" fill-opacity="0.5"/>
  <circle cx="420" cy="180" r="120" fill="#F0F9FF" fill-opacity="0.7"/>

  <!-- Main Center Smartphone Device Mockup -->
  <g filter="url(#shadowMain)">
    <!-- Phone Outer Body -->
    <rect x="170" y="50" width="260" height="460" rx="36" fill="url(#phoneGrad)"/>
    <rect x="176" y="56" width="248" height="448" rx="30" fill="#FFFFFF"/>
    
    <!-- Phone Top Dynamic Island -->
    <rect x="250" y="66" width="100" height="20" rx="10" fill="#0F172A"/>

    <!-- App Header Inside Phone -->
    <rect x="194" y="104" width="212" height="42" rx="12" fill="#F8FAFC"/>
    <circle cx="215" cy="125" r="12" fill="url(#blueGlow)"/>
    <text x="235" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#0F172A">1024 GB Storage</text>
    <text x="235" y="133" font-family="'Inter', sans-serif" font-weight="600" font-size="8.5" fill="#10B981">● 987 GB Available</text>

    <!-- App Main Storage Progress Bar Card -->
    <rect x="194" y="156" width="212" height="100" rx="16" fill="url(#blueGlow)"/>
    <text x="210" y="182" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">Free Cloud Vault</text>
    <text x="210" y="196" font-family="'Inter', sans-serif" font-weight="500" font-size="9" fill="#E0E7FF">Auto-Sync &amp; 4K Video Streaming</text>
    
    <!-- Storage Meter Bar -->
    <rect x="210" y="210" width="180" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.25"/>
    <rect x="210" y="210" width="65" height="6" rx="3" fill="#FFFFFF"/>
    <text x="210" y="232" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#FFFFFF">37.2 GB Used / 1024 GB</text>

    <!-- Video & Media Grid Item 1 -->
    <rect x="194" y="268" width="100" height="95" rx="12" fill="#F1F5F9"/>
    <rect x="194" y="268" width="100" height="65" rx="12" fill="#DBEAFE"/>
    <circle cx="244" cy="300" r="12" fill="url(#blueGlow)"/>
    <path d="M242 295L248 300L242 305V295Z" fill="#FFFFFF"/>
    <text x="202" y="352" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" fill="#0F172A">4K_Cinema.mp4</text>

    <!-- Video & Media Grid Item 2 -->
    <rect x="306" y="268" width="100" height="95" rx="12" fill="#F1F5F9"/>
    <rect x="306" y="268" width="100" height="65" rx="12" fill="#EDE9FE"/>
    <circle cx="356" cy="300" r="12" fill="url(#purpleGlow)"/>
    <path d="M354 295L360 300L354 305V295Z" fill="#FFFFFF"/>
    <text x="314" y="352" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" fill="#0F172A">Project_Files.zip</text>

    <!-- Transfer Active Banner inside Phone -->
    <rect x="194" y="375" width="212" height="65" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="214" cy="407" r="10" fill="#DCFCE7"/>
    <path d="M211 407L213.5 409.5L217 404.5" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="232" y="402" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#0F172A">Ultra-Fast Sync Active</text>
    <text x="232" y="414" font-family="'Inter', sans-serif" font-weight="500" font-size="8" fill="#64748B">34.8 MB/s • 0 Error Lossless</text>
  </g>

  <!-- Left Floating Card: High-Speed Upload Badge -->
  <g filter="url(#floatCardShadow)" transform="translate(20, 150)">
    <rect width="180" height="74" rx="18" fill="url(#heroCardGrad)" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="34" cy="37" r="18" fill="#ECFDF5"/>
    <path d="M34 29V42M34 29L29 34M34 29L39 34" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0F172A">Turbo Upload</text>
    <text x="60" y="46" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#059669">52.4 MB/s</text>
    <text x="60" y="58" font-family="'Inter', sans-serif" font-weight="500" font-size="8.5" fill="#64748B">Concurrent Slices</text>
  </g>

  <!-- Right Floating Card: Webmaster Payout Badge -->
  <g filter="url(#floatCardShadow)" transform="translate(380, 270)">
    <rect width="190" height="78" rx="18" fill="url(#heroCardGrad)" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="35" cy="39" r="18" fill="#FEF3C7"/>
    <text x="35" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="#D97706" text-anchor="middle">$</text>
    <text x="62" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11.5" fill="#0F172A">Creator Earnings</text>
    <text x="62" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="15" fill="#D97706">$4.00 CPM</text>
    <text x="62" y="61" font-family="'Inter', sans-serif" font-weight="600" font-size="8.5" fill="#10B981">+ $0.05 per referral</text>
  </g>

  <!-- Bottom Left Floating Security Badge -->
  <g filter="url(#floatCardShadow)" transform="translate(60, 370)">
    <rect width="150" height="54" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="28" cy="27" r="12" fill="#EFF6FF"/>
    <path d="M28 20L34 23V27C34 30.5 31.5 33 28 34C24.5 33 22 30.5 22 27V23L28 20Z" fill="#005CE6"/>
    <text x="46" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#0F172A">256-bit Vault</text>
    <text x="46" y="37" font-family="'Inter', sans-serif" font-weight="600" font-size="8" fill="#64748B">Zero-Knowledge</text>
  </g>
</svg>
