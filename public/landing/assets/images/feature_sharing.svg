<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shareBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0052D4"/>
      <stop offset="0.5" stop-color="#2D68FF"/>
      <stop offset="1" stop-color="#4B93FF"/>
    </linearGradient>
    <filter id="shareShadow" x="-2" y="-1" width="68" height="68" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0052D4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#shareBg)" filter="url(#shareShadow)"/>
  <!-- Ambient glow circle -->
  <circle cx="50" cy="14" r="16" fill="#FFFFFF" fill-opacity="0.12"/>
  <!-- Connecting Links -->
  <line x1="24" y1="32" x2="40" y2="22" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="32" x2="40" y2="42" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Nodes -->
  <circle cx="22" cy="32" r="6" fill="#FFFFFF"/>
  <circle cx="42" cy="21" r="6" fill="#FFFFFF"/>
  <circle cx="42" cy="43" r="6" fill="#FFFFFF"/>
</svg>
